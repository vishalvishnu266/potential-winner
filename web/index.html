<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <title>MobileApp</title>

    <!-- Design tokens & component styles -->
    <link rel="stylesheet" href="web/css/theme.css" />
    <link rel="stylesheet" href="web/css/base.css" />
    <link rel="stylesheet" href="web/css/layout.css" />
    <link rel="stylesheet" href="web/css/components.css" />

    <!-- Set data-theme early so the first paint matches user preference -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("app.theme") || "system";
          var effective = pref;
          if (pref === "system") {
            effective = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", effective);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>

    <!-- Go WASM runtime shipped with the Go SDK -->
    <script src="wasm_exec.js"></script>
    <script>
      (async function () {
        const go = new Go();
        const resp = await fetch("app.wasm");
        const bytes = await resp.arrayBuffer();
        const result = await WebAssembly.instantiate(bytes, go.importObject);
        go.run(result.instance);
      })();
    </script>
  </body>
</html>
