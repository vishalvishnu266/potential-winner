<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ERP Worker</title>
    <script src="capacitor.js"></script>
    <script src="js/version.js"></script>
    <style>
        :root {
            --primary: #ccbb00;
            --bg: #121212;
            --text: #e0e0e0;
            --surface: #1e1e1e;
            --border: #333;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #root { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #app-container { flex: 1; overflow-y: auto; padding: 1.5rem; padding-bottom: calc(80px + var(--safe-bottom)); }

        .page { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        v-layout[direction="vertical"] { display: flex; flex-direction: column; gap: 1rem; }
        v-layout[direction="horizontal"] { display: flex; gap: 0.75rem; align-items: center; }
        v-card { display: block; background: var(--surface); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border); }
        
        h1 { margin: 0 0 0.5rem 0; font-size: 1.5rem; color: var(--primary); }
        h2 { margin: 0 0 1rem 0; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
        p { margin: 0; line-height: 1.4; color: #aaa; }

        /* Bottom Tab Bar */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(65px + var(--safe-bottom));
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            padding-bottom: var(--safe-bottom);
            z-index: 100;
        }
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 0.75rem;
            color: #666;
            cursor: pointer;
        }
        .tab-item span:first-child { font-size: 1.5rem; }
        .tab-item.active { color: var(--primary); }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="ota-overlay-root"></div>
    <script src="js/app-core.js"></script>
    <script src="js/app.js"></script>
    <script src="js/ota.js"></script>
</body>
</html>
