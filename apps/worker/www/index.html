<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaadin Web Components + Capacitor SPA</title>

    <!-- 1. CAPACITOR CORE & PLUGINS -->
    <script src="capacitor.js"></script>
    
    <!-- 2. APP CONFIG & VERSION (stamped by bundler) -->
    <script src="js/version.js"></script>

    <style>
        :root {
            --primary: #ccbb00;
            --danger: #dc3545;
            --success: #28a745;
            --bg: #f4f5f7;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 520px;
            margin: 2rem auto;
            padding: 0 1rem;
            background: var(--bg);
            color: #222;
        }

        v-layout[direction="vertical"] { display: flex; flex-direction: column; gap: 0.5rem; }
        v-layout[direction="horizontal"] { display: flex; gap: 0.5rem; align-items: center; }

        .nav { margin-bottom: 1rem; }
        .nav v-button { flex: 1; }
        .nav v-button.active button { background: var(--primary); color: white; border-color: var(--primary); }

        v-card { display: block; background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 0.75rem; background: #fff; border: 1px solid #eee; margin-bottom: 0.5rem; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }

        /* Cart Badge Navigation Styling */
        .cart-badge {
            background: #ff9800;
            color: #fff;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 6px;
        }
    </style>
</head>
<body>

<div id="root"></div>

<!-- 3. OTA OVERLAY SLOT -->
<div id="ota-overlay-root"></div>

<!-- 4. APP SCRIPTS -->
<script src="js/app-core.js"></script>
<script src="js/app.js"></script>
<script src="js/ota.js"></script>

</body>
</html>
