<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DailyGig — Vanilla Framework</title>
    <style>
      :root {
        --bg: #0b1220;
        --surface: #111a2e;
        --text: #e6edf7;
        --muted: #8ea0bd;
        --primary: #4f8cff;
        --primary-2: #2f6fe0;
        --border: #1e2a44;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      a { color: var(--primary); text-decoration: none; }
      button { cursor: pointer; font: inherit; }
      #app { min-height: 100vh; display: flex; flex-direction: column; }
      .row { display: flex; gap: 8px; align-items: center; }
      .col { display: flex; flex-direction: column; gap: 8px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
      .nav { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
      .nav a { padding: 6px 10px; border-radius: 8px; }
      .nav a.active { background: var(--primary); color: white; }
      .btn { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
      .btn.primary { background: var(--primary); border-color: var(--primary); color: white; }
      .btn.danger { background: var(--danger); border-color: var(--danger); color: white; }
      .input { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: #0e172b; color: var(--text); width: 100%; }
      .main { flex: 1; padding: 16px; max-width: 720px; width: 100%; margin: 0 auto; }
      .muted { color: var(--muted); font-size: 14px; }
      h1 { margin: 0 0 12px; }
      h2 { margin: 0 0 8px; }
      ul { margin: 8px 0; padding-left: 20px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src-vanilla/main.ts"></script>
  </body>
</html>
