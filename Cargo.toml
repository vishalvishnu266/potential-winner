[package]
name = "potential-winner"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
tower-http = { version = "0.5", features = ["trace", "cors", "compression-full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
