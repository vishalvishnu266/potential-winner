[package]
name = "leptos-app"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
# Typesafe CSS Modules — reads src/**/*.module.css at compile time and
# exposes class names as Rust idents (typo = compile error). The
# accompanying `stylance-cli` binary emits the merged, hash-scoped CSS to
# dist/stylance.css (see Trunk.toml pre-build hook).
stylance = "0.5"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Navigator",
  "Location",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "console",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
