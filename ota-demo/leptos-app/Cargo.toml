[package]
name = "leptos-app"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
ota-common = { path = "../common" }

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Navigator",
  "Location",
  "Headers",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "console",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
