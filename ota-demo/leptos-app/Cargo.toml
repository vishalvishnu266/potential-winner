[package]
name = "leptos-app"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
ota-common = { path = "../common" }

# `reqwest` on `wasm32-unknown-unknown` transparently uses the browser
# `fetch` API under the hood, but hides the `web-sys::RequestInit` /
# `Headers` mutability quirks that vary across `web-sys` versions. The
# `json` feature enables `.json(&body)` / `.json::<T>().await`.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# `web-sys` is still used for `Window`, `Navigator`, `Location`, and
# `console` (panic hook). The Fetch/Request/Response/Headers features
# were dropped when we switched to reqwest.
[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Navigator",
  "Location",
  "console",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
